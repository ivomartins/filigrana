# Mantém actualizados os hashes fixados das acções em .github/workflows/ e a única dependência
# npm (de desenvolvimento): @playwright/test. Não há dependências de execução.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
